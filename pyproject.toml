[project]
name = "espies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.scripts]
espies = "espies.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "tenacity>=8.0",
    "ruff>=0.15",
    "pytest>=9.0",
    "pytest-cov>=5.0",
]
